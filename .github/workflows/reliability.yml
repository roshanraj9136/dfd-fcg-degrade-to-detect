name: Reliability regression checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  viva-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/viva/package-lock.json
      - run: python scripts/export_viva_evidence.py --check
      - run: npm ci --no-audit --no-fund
        working-directory: web/viva
      - run: npm run build
        working-directory: web/viva
  cpu-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy>=1.26,<2.3" "scikit-learn>=1.5,<2"
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python -m compileall -q service/app service/ens tests/test_reliability.py
