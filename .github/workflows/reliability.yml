name: Reliability regression checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy>=1.26,<2.3"
      - run: python -m unittest discover -s tests -p "test_reliability.py" -v
      - run: python -m compileall -q service/app service/ens tests/test_reliability.py
